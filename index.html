<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>排序演算法視覺化</title>
<style>
    body {
        font-family: Arial;
        text-align: center;
        background: #f5f5f5;
    }

    h1 {
        margin-top: 20px;
    }

    #controls {
        margin: 20px;
    }

    button, select {
        padding: 8px 12px;
        margin: 5px;
        font-size: 16px;
    }

    #array {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        height: 300px;
        margin-top: 20px;
    }

    .bar {
        width: 8px;
        margin: 0 1px;
        background: #3498db;
    }

    .active {
        background: red;
    }

    .sorted {
        background: green;
    }
</style>
</head>

<body>

<h1>排序演算法動畫</h1>

<div id="controls">
    <select id="algorithm">
        <option value="bubble">氣泡排序</option>
        <option value="selection">選擇排序</option>
        <option value="insertion">插入排序</option>
        <option value="merge">合併排序</option>
        <option value="quick">快速排序</option>
    </select>

    <button onclick="generateArray()">重新產生</button>
    <button onclick="startSort()">開始排序</button>
</div>

<div id="array"></div>

<script>
let array = [];
let delay = 30;

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

function generateArray() {
    array = [];
    const container = document.getElementById("array");
    container.innerHTML = "";

    for (let i = 0; i < 50; i++) {
        let value = Math.floor(Math.random() * 250) + 10;
        array.push(value);

        let bar = document.createElement("div");
        bar.classList.add("bar");
        bar.style.height = value + "px";
        container.appendChild(bar);
    }
}

function updateBars(active = []) {
    const bars = document.getElementsByClassName("bar");

    for (let i = 0; i < bars.length; i++) {
        bars[i].style.height = array[i] + "px";
        bars[i].classList.remove("active");
        if (active.includes(i)) {
            bars[i].classList.add("active");
        }
    }
}

async function bubbleSort() {
    for (let i = 0; i < array.length; i++) {
        for (let j = 0; j < array.length - i - 1; j++) {
            updateBars([j, j+1]);
            await sleep(delay);

            if (array[j] > array[j+1]) {
                [array[j], array[j+1]] = [array[j+1], array[j]];
            }
        }
    }
}

async function selectionSort() {
    for (let i = 0; i < array.length; i++) {
        let min = i;

        for (let j = i + 1; j < array.length; j++) {
            updateBars([min, j]);
            await sleep(delay);

            if (array[j] < array[min]) {
                min = j;
            }
        }

        [array[i], array[min]] = [array[min], array[i]];
    }
}

async function insertionSort() {
    for (let i = 1; i < array.length; i++) {
        let key = array[i];
        let j = i - 1;

        while (j >= 0 && array[j] > key) {
            array[j + 1] = array[j];
            j--;

            updateBars([j, j+1]);
            await sleep(delay);
        }
        array[j + 1] = key;
    }
}

async function mergeSort(start = 0, end = array.length - 1) {
    if (start >= end) return;

    let mid = Math.floor((start + end) / 2);
    await mergeSort(start, mid);
    await mergeSort(mid + 1, end);
    await merge(start, mid, end);
}

async function merge(start, mid, end) {
    let temp = [];
    let i = start, j = mid + 1;

    while (i <= mid && j <= end) {
        if (array[i] < array[j]) temp.push(array[i++]);
        else temp.push(array[j++]);
    }

    while (i <= mid) temp.push(array[i++]);
    while (j <= end) temp.push(array[j++]);

    for (let k = start; k <= end; k++) {
        array[k] = temp[k - start];
        updateBars([k]);
        await sleep(delay);
    }
}

async function quickSort(low = 0, high = array.length - 1) {
    if (low < high) {
        let pi = await partition(low, high);
        await quickSort(low, pi - 1);
        await quickSort(pi + 1, high);
    }
}

async function partition(low, high) {
    let pivot = array[high];
    let i = low - 1;

    for (let j = low; j < high; j++) {
        updateBars([j, high]);
        await sleep(delay);

        if (array[j] < pivot) {
            i++;
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    [array[i+1], array[high]] = [array[high], array[i+1]];
    return i + 1;
}

async function startSort() {
    const algo = document.getElementById("algorithm").value;

    if (algo === "bubble") await bubbleSort();
    if (algo === "selection") await selectionSort();
    if (algo === "insertion") await insertionSort();
    if (algo === "merge") await mergeSort();
    if (algo === "quick") await quickSort();
}

generateArray();
</script>

</body>
</html>
